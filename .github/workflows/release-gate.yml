name: Nexus Link Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-release-gate:
    name: web-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            /*
            !/output/
            !/assets/reference/
            !/assets/characters/greyshade-cat/inbox/
            !/assets/characters/greyshade-cat/inbox_manual_transparent/
            !/assets/characters/greyshade-cat/frames/
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.60.0
          python -m playwright install --with-deps chromium

      - name: Run repo-native web release gate
        run: >-
          python docs/qa/_run_web_release_gate.py
          --base http://127.0.0.1:5238
          --port 5238
          --output "$RUNNER_TEMP/web-release-gate.json"

      - name: Run Raphael sovereign safety and contract suites
        run: |
          node docs/qa/raphael-psychological-safety-v1-cases.mjs
          node docs/qa/raphael-runtime-contract-v1-cases.mjs

      - name: Upload compact release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-release-gate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-release-gate.json
          if-no-files-found: warn
          retention-days: 14
