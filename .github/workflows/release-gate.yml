name: Nexus Link Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-release-gate:
    name: web-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            /*
            !/output/
            !/assets/reference/
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.60.0
          python -m playwright install --with-deps chromium

      - name: Run repo-native web release gate
        run: >-
          python docs/qa/_run_web_release_gate.py
          --base http://127.0.0.1:5238
          --port 5238
          --output "$RUNNER_TEMP/web-release-gate.json"

      - name: Upload compact release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-release-gate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-release-gate.json
          if-no-files-found: warn
          retention-days: 14
