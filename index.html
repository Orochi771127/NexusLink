<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nexus Link / 心核連結</title>
    <link rel="preload" as="image" href="./assets/backgrounds/BG_01_LakeNightCamp.png" />
    <link rel="preload" as="image" href="./assets/ui/panels/UI_CoreHudCompact.png" />
    <link rel="preload" as="image" href="./assets/ui/panels/UI_SoulTalkPanel_Compact.png" />
    <link rel="preload" as="image" href="./assets/platforms/Platform_LakeMagicCircle.png" />
    <link rel="preload" as="image" href="./assets/platforms/Platform_NexusAssessmentCircle.png" />
    <link rel="preload" as="image" href="./assets/ui/buttons/BTN_Explore.png" />
    <link rel="preload" as="image" href="./assets/ui/buttons/BTN_Care.png" />
    <link rel="preload" as="image" href="./assets/ui/buttons/BTN_Growth.png" />
    <link rel="preload" as="image" href="./assets/ui/buttons/BTN_Memory.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="Nexus Link full-screen habitat home">
      <section class="habitat-stage" aria-label="Nexus Link emotional habitat">
        <div id="game-root" aria-label="Nexus Link emotional habitat scene"></div>

        <section class="core-hud" aria-label="Companion core status">
          <button class="core-hud-open" type="button" data-panel-trigger="character" aria-label="開啟角色詳情">
            <span class="avatar-orb" aria-hidden="true"></span>
            <span class="core-copy">
              <span id="fox-name" class="core-name">載入中...</span>
              <span class="core-kicker">NEXUS CORE</span>
              <span class="level-pill">Lv 01</span>
            </span>
            <span class="core-status-dot" aria-hidden="true"></span>
          </button>
        </section>

        <section class="quick-hud" aria-label="Quick resources and actions">
          <div class="resource-pill" aria-label="coins">◎ 1,280</div>
          <div class="resource-pill" aria-label="crystals">◇ 36</div>
          <button type="button" aria-label="notifications">🔔</button>
          <button type="button" aria-label="mail">✉</button>
          <button type="button" aria-label="settings">⚙</button>
        </section>

        <div class="habitat-caption" id="status-text" aria-live="polite">正在建立心核連線...</div>

        <button class="soul-talk-launcher" type="button" data-panel-trigger="soulTalk" aria-label="開啟 Soul Talk">
          <span>
            <strong>SOUL TALK</strong>
            <em id="soul-talk-preview">我在這裡，安靜地看著你。</em>
          </span>
          <b aria-hidden="true">開啟</b>
        </button>

        <nav class="bottom-nav" aria-label="Primary actions">
          <button type="button" data-action="explore">
            <span class="nav-art" aria-hidden="true"></span>
            <span class="nav-label">探索</span>
          </button>
          <button type="button" data-action="care">
            <span class="nav-art" aria-hidden="true"></span>
            <span class="nav-label">照顧</span>
          </button>
          <button type="button" data-action="grow">
            <span class="nav-art" aria-hidden="true"></span>
            <span class="nav-label">成長</span>
          </button>
          <button type="button" data-action="memory">
            <span class="nav-art" aria-hidden="true"></span>
            <span class="nav-label">記憶</span>
          </button>
        </nav>

        <div class="panel-layer" data-active-panel="none" aria-hidden="true">
          <button class="panel-backdrop" type="button" data-panel-close aria-label="關閉面板"></button>

          <section class="modal-panel character-modal" role="dialog" aria-modal="true" aria-labelledby="character-title" data-panel="character">
            <header class="panel-header">
              <div>
                <p>NEXUS CORE</p>
                <h2 id="character-title">角色詳情</h2>
              </div>
              <button type="button" class="panel-close" data-panel-close aria-label="關閉角色詳情">×</button>
            </header>
            <div class="character-summary">
              <span class="avatar-orb avatar-orb-large" aria-hidden="true"></span>
              <div>
                <h3 id="modal-creature-name">載入中...</h3>
                <p id="modal-creature-description">正在同步夥伴資料。</p>
              </div>
            </div>
            <div class="core-stat-list" aria-label="Companion detail stats">
              <div class="core-stat-row">
                <span class="core-stat-label">BOND</span>
                <div class="core-stat-bar"><span id="bond-fill" class="core-stat-fill"></span></div>
                <strong id="bond-value" class="core-stat-value">0</strong>
              </div>
              <div class="core-stat-row">
                <span class="core-stat-label">MOOD</span>
                <div class="core-stat-bar"><span id="mood-fill" class="core-stat-fill"></span></div>
                <strong id="mood-value" class="core-stat-value">calm</strong>
              </div>
              <div class="core-stat-row">
                <span class="core-stat-label">ENERGY</span>
                <div class="core-stat-bar"><span id="energy-fill" class="core-stat-fill"></span></div>
                <strong id="energy-value" class="core-stat-value">10</strong>
              </div>
              <div class="core-stat-row">
                <span class="core-stat-label">TRUST</span>
                <div class="core-stat-bar"><span id="trust-fill" class="core-stat-fill"></span></div>
                <strong id="trust-value" class="core-stat-value">5</strong>
              </div>
            </div>
          </section>

          <section class="modal-panel soul-talk-modal" role="dialog" aria-modal="true" aria-labelledby="soul-talk-title" data-panel="soulTalk">
            <header class="panel-header">
              <div>
                <p>SOUL TALK</p>
                <h2 id="soul-talk-title">靈魂聖域</h2>
              </div>
              <button type="button" class="panel-close" data-panel-close aria-label="關閉 Soul Talk">×</button>
            </header>
            <div id="chat-log" class="chat-log" aria-live="polite"></div>
            <div class="chat-input-row">
              <input
                id="message-input"
                type="text"
                placeholder="對心核夥伴說一句話..."
                autocomplete="off"
              />
              <button id="send-button" type="button">送出</button>
            </div>
          </section>

          <section class="action-sheet" role="dialog" aria-modal="true" aria-labelledby="action-sheet-title" data-panel="actionSheet">
            <header class="panel-header">
              <div>
                <p>HOME ACTION</p>
                <h2 id="action-sheet-title">行動選單</h2>
              </div>
              <button type="button" class="panel-close" data-panel-close aria-label="關閉行動選單">×</button>
            </header>
            <p id="action-sheet-copy" class="action-sheet-copy">選擇一個行動，讓夥伴回應。</p>
            <div class="sheet-action-grid">
              <button type="button" data-sheet-choice="primary">開始</button>
              <button type="button" data-sheet-choice="soulTalk">詢問夥伴</button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.8.1/dist/pixi.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
