<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Link / 心核連結</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="status-panel" aria-label="Companion status">
        <div>
          <span class="label">Bond</span>
          <strong id="bond-value">0</strong>
        </div>
        <div>
          <span class="label">Trust</span>
          <strong id="trust-value">5</strong>
        </div>
        <div>
          <span class="label">Mood</span>
          <strong id="mood-value">calm</strong>
        </div>
        <div>
          <span class="label">Energy</span>
          <strong id="energy-value">10</strong>
        </div>
      </section>

      <section class="world-card" aria-label="Nexus Link emotional habitat">
        <header class="world-header">
          <div>
            <p>NEXUS LINK</p>
            <h1 id="fox-name">載入中...</h1>
          </div>
          <span class="habitat-pill">夜間湖畔營地</span>
        </header>
        <div id="game-root" aria-label="Nexus Link emotional habitat scene"></div>
        <footer class="world-footer">
          <span id="status-text">正在建立心核連線...</span>
        </footer>
      </section>

      <section class="chat-panel" aria-label="Soul Talk companion chat panel">
        <header class="chat-header">
          <div>
            <p>SOUL TALK</p>
            <h2>靈魂聖域</h2>
          </div>
          <span>低語模式</span>
        </header>
        <div id="chat-log" class="chat-log"></div>
        <div class="chat-input-row">
          <input
            id="message-input"
            type="text"
            placeholder="對心核夥伴說一句話..."
            autocomplete="off"
          />
          <button id="send-button" type="button">送出</button>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="Primary actions">
        <button type="button" data-action="explore">探索</button>
        <button type="button" data-action="care">照顧</button>
        <button type="button" data-action="grow">成長</button>
        <button type="button" data-action="memory">記憶</button>
      </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.8.1/dist/pixi.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
