<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nexus Link / 心核連結</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2730%27%20fill%3D%27%23050915%27%2F%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2718%27%20fill%3D%27%2300ced1%27%2F%3E%3C%2Fsvg%3E" />
    <style>
      :root {
        --bg: #050915;
        --bg-deep: #02050f;
        --cyan: #00CED1;
        --cyan-dim: #00a8ac;
        --text: #e8f4ff;
        --text-muted: #7a95b0;
        --glass: rgba(10, 15, 30, 0.6);
        --border: rgba(0, 206, 209, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Noto Sans TC", Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        position: relative;
      }

      /* Night lake / cyber-taoist subtle backdrop */
      .bg-veil {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 38%, rgba(0, 206, 209, 0.035) 0%, transparent 55%),
          radial-gradient(ellipse at 50% 72%, rgba(0, 30, 45, 0.45) 0%, transparent 62%);
        pointer-events: none;
        z-index: 0;
      }

      .orb {
        position: fixed;
        top: 32%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 168px;
        height: 168px;
        border-radius: 999px;
        background: radial-gradient(circle at 48% 42%, rgba(0, 206, 209, 0.12), rgba(0, 206, 209, 0.02) 40%, transparent 70%);
        border: 1px solid rgba(0, 206, 209, 0.18);
        box-shadow: 0 0 80px rgba(0, 206, 209, 0.08);
        z-index: 0;
        pointer-events: none;
      }

      .orb::after {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 999px;
        border: 1px solid rgba(0, 206, 209, 0.12);
      }

      .launcher {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 520px;
        padding: 48px 28px 56px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 4px;
      }

      .logo svg {
        width: 28px;
        height: 28px;
      }

      .logo-text {
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--cyan);
        opacity: 0.85;
        font-weight: 500;
      }

      .title {
        font-size: 42px;
        line-height: 1.05;
        font-weight: 600;
        letter-spacing: -0.4px;
        margin: 0 0 2px;
      }

      .title .en {
        font-size: 0.72em;
        font-weight: 400;
        opacity: 0.65;
        margin-left: 6px;
      }

      .tagline {
        font-size: 15px;
        line-height: 1.6;
        color: var(--text-muted);
        max-width: 28ch;
        margin: 4px 0 8px;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
        padding: 14px 42px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: #041018;
        background: var(--cyan);
        border: 1px solid var(--cyan);
        border-radius: 999px;
        text-decoration: none;
        box-shadow: 0 4px 18px rgba(0, 206, 209, 0.35);
        transition: transform 120ms ease, box-shadow 160ms ease, background 120ms ease;
        cursor: pointer;
      }

      .cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 28px rgba(0, 206, 209, 0.45);
        background: #00e0e5;
      }

      .cta:active {
        transform: translateY(0);
      }

      .cta .arrow {
        font-size: 18px;
        line-height: 1;
        transform: translateX(1px);
      }

      .meta {
        margin-top: 22px;
        font-size: 12.5px;
        color: var(--text-muted);
        opacity: 0.75;
      }

      .auto-note {
        font-size: 12px;
        color: var(--text-muted);
        opacity: 0.6;
        margin-top: 2px;
      }

      .stay {
        appearance: none;
        background: transparent;
        border: 0;
        color: var(--cyan-dim);
        font-size: 12px;
        padding: 6px 10px;
        margin-top: 4px;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
        opacity: 0.7;
        transition: opacity 120ms ease;
      }

      .stay:hover {
        opacity: 1;
      }

      .status {
        font-size: 11px;
        color: var(--cyan);
        opacity: 0.65;
        min-height: 16px;
        margin-top: 6px;
      }

      @media (max-width: 480px) {
        .launcher {
          padding: 36px 20px 44px;
        }
        .title {
          font-size: 36px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-veil" aria-hidden="true"></div>
    <div class="orb" aria-hidden="true"></div>

    <main class="launcher" role="main" aria-label="Nexus Link 啟動頁">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="30" fill="#050915"/>
          <circle cx="32" cy="32" r="18" fill="#00CED1"/>
          <circle cx="32" cy="32" r="9" fill="#050915"/>
        </svg>
        <span class="logo-text">NEXUS LINK</span>
      </div>

      <h1 class="title">心核連結<span class="en">/ Nexus Link</span></h1>

      <p class="tagline">這不是電子寵物，這是你的夥伴。</p>

      <a id="enter-btn" class="cta" href="./r2/" aria-label="進入 R2 Demo">
        進入 R2 Demo
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <div class="meta">
        <div class="auto-note">1.5 秒後將自動導向 R2</div>
        <button id="stay-btn" class="stay" type="button">取消自動導向，留在這個畫面</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
    </main>

    <script>
      (function () {
        var AUTO_DELAY = 1500;
        var timer = null;
        var cancelled = false;
        var statusEl = document.getElementById('status');
        var enterBtn = document.getElementById('enter-btn');
        var stayBtn = document.getElementById('stay-btn');

        function go() {
          window.location.href = './r2/';
        }

        function clearAuto() {
          if (timer) {
            clearTimeout(timer);
            timer = null;
          }
        }

        function cancelAutoAndStay() {
          if (cancelled) return;
          cancelled = true;
          clearAuto();
          if (statusEl) statusEl.textContent = '已取消自動導向';
          if (stayBtn) stayBtn.style.display = 'none';
        }

        // Primary button: immediate navigation + ensure timer cleared
        if (enterBtn) {
          enterBtn.addEventListener('click', function (e) {
            clearAuto();
            // allow default href navigation
          });
        }

        if (stayBtn) {
          stayBtn.addEventListener('click', cancelAutoAndStay);
        }

        // Start the gentle auto-redirect (only if not cancelled by interaction)
        timer = setTimeout(function () {
          if (!cancelled) {
            go();
          }
        }, AUTO_DELAY);

        // Keyboard support: pressing Enter on the page activates primary action (when focused on body)
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && document.activeElement === document.body) {
            e.preventDefault();
            clearAuto();
            go();
          }
        });

        // Expose for debugging if needed (no side effects)
        window.__nexusLauncher = { cancelAuto: cancelAutoAndStay, go: go };
      })();
    </script>
  </body>
</html>
