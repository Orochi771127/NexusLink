<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nexus Link / 心核連結</title>
    <link rel="preload" as="image" href="./assets/backgrounds/LakeNightCamp_v2/bg_day_base.png" />
    <link rel="preload" as="image" href="./assets/backgrounds/LakeNightCamp_v2/bg_night_base.png" />
    <link rel="preload" as="image" href="./assets/platforms/LakeNightCamp_v2/magic_circle.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="Nexus Link home screen">
      <section class="habitat-stage" aria-label="Nexus Link emotional habitat">
        <div id="game-root" aria-label="Nexus Link emotional habitat scene"></div>

        <section class="core-hud" aria-label="Companion core status">
          <button class="core-hud-open" type="button" data-panel-trigger="character" aria-label="Open companion status">
            <span class="avatar-orb" aria-hidden="true"></span>
            <span class="core-copy">
              <span id="fox-name" class="core-name">Loading...</span>
              <span class="core-kicker">NEXUS CORE</span>
              <span class="level-pill">Lv 01</span>
            </span>
            <span class="core-status-dot" aria-hidden="true"></span>
          </button>
        </section>

        <section class="quick-hud" aria-label="Quick resources and actions">
          <div class="resource-hud" aria-label="Resources">
            <div class="resource-item coin" aria-label="coins">
              <span class="resource-icon" aria-hidden="true"></span>
              <span class="resource-value">1280</span>
            </div>
            <div class="resource-item gem" aria-label="gems">
              <span class="resource-icon" aria-hidden="true"></span>
              <span class="resource-value">36</span>
            </div>
          </div>
          <div class="settings-group">
            <button id="btn-settings-toggle" type="button" aria-label="Settings" aria-expanded="false">...</button>
            <div id="settings-dropdown" class="settings-dropdown">
              <button id="btn-audio-toggle" class="settings-item audio-toggle" type="button" aria-label="Toggle audio">Audio</button>
              <button id="btn-mail" class="settings-item mail" type="button" aria-label="Mail"></button>
              <button id="btn-support" class="settings-item support" type="button" aria-label="Support"></button>
            </div>
          </div>
        </section>

        <button class="soul-talk-launcher" type="button" data-panel-trigger="soulTalk" aria-label="Open Soul Talk">
          <span>
            <strong>SOUL TALK</strong>
            <em id="soul-talk-preview">The companion listens quietly.</em>
          </span>
          <b aria-hidden="true">Talk</b>
        </button>

        <nav class="bottom-nav" aria-label="Primary actions">
          <button type="button" data-action="explore">
            <div class="nav-icon-geo" aria-hidden="true"></div>
            <span class="nav-label">探索</span>
          </button>
          <button type="button" data-action="care">
            <div class="nav-icon-geo" aria-hidden="true"></div>
            <span class="nav-label">照顧</span>
          </button>
          <button type="button" data-action="grow">
            <div class="nav-icon-geo" aria-hidden="true"></div>
            <span class="nav-label">成長</span>
          </button>
          <button type="button" data-action="memory">
            <div class="nav-icon-geo" aria-hidden="true"></div>
            <span class="nav-label">記憶</span>
          </button>
        </nav>

        <div class="panel-layer" data-active-panel="none" aria-hidden="true">
          <button class="panel-backdrop" type="button" data-panel-close aria-label="Close panel"></button>

          <section class="modal-panel character-modal" role="dialog" aria-modal="true" aria-labelledby="character-title" data-panel="character">
            <header class="panel-header">
              <div>
                <p>NEXUS CORE</p>
                <h2 id="character-title">Companion Status</h2>
              </div>
              <button type="button" class="panel-close" data-panel-close aria-label="Close companion status">X</button>
            </header>
            <div class="character-summary">
              <span class="avatar-orb avatar-orb-large" aria-hidden="true"></span>
              <div>
                <h3 id="modal-creature-name">Loading...</h3>
                <p id="modal-creature-description">Companion data is loading.</p>
              </div>
            </div>
            <div class="core-stat-list" aria-label="Companion detail stats">
              <div class="core-stat-row" data-stat="bond">
                <span class="core-stat-label">BOND</span>
                <div class="core-stat-bar"><span id="bond-fill" class="core-stat-fill"></span></div>
                <strong id="bond-value" class="core-stat-value">0</strong>
              </div>
              <div class="core-stat-row" data-stat="mood">
                <span class="core-stat-label">MOOD</span>
                <div class="core-stat-bar"><span id="mood-fill" class="core-stat-fill"></span></div>
                <strong id="mood-value" class="core-stat-value">calm</strong>
              </div>
              <div class="core-stat-row" data-stat="energy">
                <span class="core-stat-label">ENERGY</span>
                <div class="core-stat-bar"><span id="energy-fill" class="core-stat-fill"></span></div>
                <strong id="energy-value" class="core-stat-value">10</strong>
              </div>
              <div class="core-stat-row" data-stat="trust">
                <span class="core-stat-label">TRUST</span>
                <div class="core-stat-bar"><span id="trust-fill" class="core-stat-fill"></span></div>
                <strong id="trust-value" class="core-stat-value">5</strong>
              </div>
            </div>
          </section>

          <section id="soul-talk-panel" class="modal-panel soul-talk-modal" role="dialog" aria-modal="true" aria-label="Soul Talk" data-panel="soulTalk">
            <button type="button" class="panel-close" data-panel-close aria-label="Close Soul Talk">X</button>
            <p id="status-text" class="soul-status-text" aria-live="polite">SOUL TALK</p>
            <div id="chat-log" class="chat-log" aria-live="polite"></div>
            <div class="chat-input-row">
              <input
                id="message-input"
                type="text"
                placeholder="Say something softly..."
                autocomplete="off"
              />
              <button id="send-button" type="button">Send</button>
            </div>
          </section>

          <section class="action-sheet" role="dialog" aria-modal="true" aria-labelledby="action-sheet-title" data-panel="actionSheet">
            <header class="panel-header">
              <div>
                <p>HOME ACTION</p>
                <h2 id="action-sheet-title">Action</h2>
              </div>
              <button type="button" class="panel-close" data-panel-close aria-label="Close action sheet">X</button>
            </header>
            <p id="action-sheet-copy" class="action-sheet-copy">Choose one quiet action.</p>
            <div id="action-sheet-actions" class="sheet-action-list" aria-label="Action choices"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.8.1/dist/pixi.min.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
