<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KB Diagnostic v3 — no position:fixed</title>
<style>
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; background: #0a1020; color: #eaf2ff;
    font-family: -apple-system, system-ui, "PingFang TC", sans-serif; }
  #note { padding: 14px; background: rgba(2, 8, 22, 0.92); border-bottom: 2px solid #8affc1;
    font-size: 15px; line-height: 1.55; }
  #note b { color: #8affc1; }
  /* 刻意不用 position:fixed —— 上一版的 #info（fixed;top:0）在鍵盤打開時整塊從畫面消失，
     證明這台裝置在鍵盤顯示期間 position:fixed 本身會失效（iOS 老毛病：鍵盤彈出時瀏覽器把
     頁面「捲動置中」到 focus 元素，fixed 元素那段時間會跟著頁面捲走，不會真的貼在螢幕上）。
     這版改成完全正常文件流，讓瀏覽器原生 scroll-into-view 把 drawer 整塊一起帶上去，
     沒有「兩層各自運作、中間留黑縫」的結構問題。 */
  #filler { height: 66vh;
    background: repeating-linear-gradient(180deg, #122142 0 40px, #0c1733 40px 80px);
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px;
    color: #5f76ad; font-size: 13px; }
  #drawer { position: static; background: #15244e; border: 2px solid #8affc1;
    border-radius: 16px 16px 0 0; padding: 14px 16px 18px; display: flex;
    flex-direction: column; gap: 9px; }
  #drawer .msg { color: #c8d6f5; font-size: 14px; }
  #live { color: #ffd98a; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  #kbinput { width: 100%; height: 46px; font-size: 16px; border-radius: 9px;
    border: 1px solid #9bb; padding: 0 12px; background: #fff; color: #111; }
  #tail { height: 10vh; }
</style>
</head>
<body>
  <div id="note">這版<b>完全不用 position:fixed</b>。上一版的診斷面板在鍵盤打開時整塊消失，
    代表這裝置鍵盤彈出時 fixed 會失效、跟著頁面捲走。這版把「對話 + 輸入框」都放在
    <b>普通文件流</b>裡，靠瀏覽器原生把 focus 元素捲進畫面，不自己搬任何東西。
    請往下捲到深藍色對話框，點輸入框彈鍵盤，截圖看對話框底部跟鍵盤之間<b>還有沒有黑縫</b>。</div>
  <div id="filler">↓ 往下捲到對話框 ↓</div>
  <div id="drawer">
    <div class="msg">灰影貓：…你在想什麼呢。</div>
    <div class="msg">灰影貓：慢慢說，我在聽。</div>
    <div id="live">讀取中…</div>
    <input id="kbinput" type="text" placeholder="點我彈出鍵盤，再截圖看有沒有縫">
  </div>
  <div id="tail"></div>

<script>
(function () {
  var live = document.getElementById('live');
  function r(n) { return Math.round(n); }
  function update(tag) {
    var vv = window.visualViewport;
    live.textContent =
      'innerHeight=' + r(window.innerHeight) +
      ' vv.height=' + (vv ? r(vv.height) : -1) +
      ' vv.offsetTop=' + (vv ? r(vv.offsetTop) : -1) +
      ' scrollY=' + r(window.scrollY || 0) +
      ' [' + (tag || '') + ']';
  }
  function loop() { update('rAF'); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', function () { update('vv.resize'); });
  }
  document.getElementById('kbinput').addEventListener('focus', function () { update('focus'); });
  update('init');
})();
</script>
</body>
</html>
