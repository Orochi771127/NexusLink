<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>KB Diagnostic v2 — resizes-content</title>
<style>
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; background: #0a1020; color: #eaf2ff;
    font-family: -apple-system, system-ui, "PingFang TC", sans-serif; }
  #info { position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    padding: 12px 14px; background: rgba(2, 8, 22, 0.82);
    border-bottom: 2px solid #ffb37c; font-size: 16px; line-height: 1.5;
    font-variant-numeric: tabular-nums; }
  #info b { color: #ffb37c; font-weight: 700; }
  #verdict { margin-top: 6px; font-size: 18px; font-weight: 800; }
  #verdict.kb { color: #8affc1; }
  #verdict.nokb { color: #ff9d7a; }
  #scene { height: 220vh;
    background: repeating-linear-gradient(180deg, #122142 0 40px, #0c1733 40px 80px); }
  /* 這次不用 JS 算 top，純 CSS position:fixed;bottom:0 —— 這就是要驗證的「免 JS」假設。 */
  #bar { position: fixed; left: 8px; right: 8px; bottom: 8px; height: 132px; z-index: 20;
    background: #15244e; border: 2px solid #ffb37c; border-radius: 14px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 9px;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.5); }
  #bar .lbl { color: #ffd9b8; font-size: 13px; line-height: 1.4; }
  #kbinput { width: 100%; height: 46px; font-size: 16px; border-radius: 9px;
    border: 1px solid #9bb; padding: 0 12px; background: #fff; color: #111; }
  #barpos { color: #ffd98a; font-size: 13px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div id="info">
    讀取中…
    <div id="verdict"></div>
  </div>
  <div id="scene"></div>

  <div id="bar">
    <div class="lbl">這版測試 <b style="color:#fff">interactive-widget=resizes-content</b>（不是 resizes-visual）。
      這個橘框是<b style="color:#fff">純 CSS position:fixed;bottom:0，完全沒有 JS 調整位置</b>。
      請點下面輸入框彈出鍵盤，截圖看橘框是否自己貼到鍵盤上方，同時看上面數字裡的
      <b style="color:#fff">innerHeight / clientHeight 有沒有自己變小</b>。</div>
    <input id="kbinput" type="text" placeholder="點我彈出鍵盤，再截圖">
    <div id="barpos"></div>
  </div>

<script>
(function () {
  var info = document.getElementById('info');
  var bar = document.getElementById('bar');
  var barpos = document.getElementById('barpos');
  var baselineHeight = 0;
  function r(n) { return Math.round(n); }

  function update(tag) {
    var vv = window.visualViewport;
    var innerH = r(window.innerHeight);
    var clientH = r(document.documentElement.clientHeight);
    var vvH = vv ? r(vv.height) : -1;
    var vvTop = vv ? r(vv.offsetTop) : -1;
    var scrollY = r(window.scrollY || window.pageYOffset || 0);

    // 基準值：頁面載入後、鍵盤還沒開之前的高度（用來偵測「版面本身有沒有縮小」）。
    if (!baselineHeight) baselineHeight = Math.max(innerH, clientH);
    var layoutShrink = Math.max(0, baselineHeight - Math.min(innerH, clientH));
    var kbOpen = layoutShrink > 80;

    info.innerHTML =
      '<b>innerHeight</b> = ' + innerH + '　　<b>clientHeight</b> = ' + clientH + '<br>' +
      '<b>vv.height</b> = ' + vvH + '　　<b>vv.offsetTop</b> = ' + vvTop + '<br>' +
      '<b>scrollY</b> = ' + scrollY + '　　<b>baseline</b> = ' + baselineHeight + '<br>' +
      '<b>layoutShrink</b> = ' + layoutShrink + '　　<b>event</b> = ' + (tag || '') +
      '<div id="verdict" class="' + (kbOpen ? 'kb' : 'nokb') + '">' +
      (kbOpen ? '✅ 版面本身縮小了（resizes-content 生效）' : '❌ 版面沒有縮小（跟上一版一樣卡住）') + '</div>';

    var barRect = bar.getBoundingClientRect();
    barpos.textContent = '橘框（純CSS,無JS）top=' + r(barRect.top) + ' bottom=' + r(barRect.bottom) +
      '（bottom 應貼在螢幕最下面、鍵盤正上方）';
  }

  function loop() { update('rAF'); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  if (window.visualViewport) {
    visualViewport.addEventListener('resize', function () { update('vv.resize'); });
    visualViewport.addEventListener('scroll', function () { update('vv.scroll'); });
  }
  window.addEventListener('resize', function () { update('resize'); });
  document.getElementById('kbinput').addEventListener('focus', function () { update('focus'); });
  update('init');
})();
</script>
</body>
</html>
