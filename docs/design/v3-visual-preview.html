<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nexus Link V3 Visual Preview</title>
    <link rel="stylesheet" href="./v3-visual-tokens.css" />
  </head>
  <body>
    <main class="v3-preview-page" aria-label="Nexus Link V3 design-only mobile preview">
      <article class="v3-device" aria-label="390 by 844 Moonlake home preview">
        <div class="v3-scene" aria-hidden="true"></div>
        <div class="v3-stars" aria-hidden="true"></div>

        <section class="v3-hud" aria-label="Companion identity">
          <span class="v3-avatar" aria-hidden="true"></span>
          <span class="v3-hud-copy">
            <strong>灰影貓</strong>
            <span>心核夥伴 · 安靜觀察</span>
          </span>
        </section>

        <div class="v3-top-actions" aria-label="Preview controls">
          <span class="v3-icon-button" aria-hidden="true">◌</span>
          <span class="v3-icon-button" aria-hidden="true">⚙</span>
        </div>

        <section class="v3-home-copy">
          <span class="v3-eyebrow">MOONLAKE HABITAT</span>
          <h1>心核連結</h1>
          <p>你可以說話，也可以只是待著。</p>
        </section>

        <div class="v3-companion-zone" aria-label="Illustrated companion focal zone placeholder">
          <div class="v3-companion-halo" aria-hidden="true"></div>
          <div class="v3-companion-placeholder" aria-hidden="true"></div>
        </div>

        <section class="v3-presence" aria-label="Companion presence example">
          <small>牠此刻的狀態</small>
          <p>牠把距離留在自己覺得安心的地方。</p>
        </section>

        <section class="v3-soul-strip" aria-label="Soul Talk example">
          <span>湖面還留著一點上次的光。</span>
          <b>心語</b>
        </section>

        <nav class="v3-nav" aria-label="Core action preview">
          <span class="v3-nav-item">探索</span>
          <span class="v3-nav-item is-current">照顧</span>
          <span class="v3-nav-item">成長</span>
          <span class="v3-nav-item">記憶</span>
        </nav>
      </article>
      <p class="v3-preview-caption">
        Design-only preview. Scene, companion, and UI remain separate layers; this page does not use or modify runtime assets.
      </p>
    </main>
  </body>
</html>
